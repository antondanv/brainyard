name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@antondanv/brainyard
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The release tag matches both packages
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for pkg in packages/brainyard packages/cli; do
            expected="v$(node -p "require('./$pkg/package.json').version")"
            if [ "$TAG" != "$expected" ]; then
              echo "::error::Release $TAG does not match $pkg/package.json, which says $expected"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The API goes first: the CLI depends on that exact version. prepack builds each
      # package and copies the README, changelog and licence in. Trusted publishing needs
      # no token and adds provenance; each package has its own trusted publisher on npm.
      # A version npm already has is skipped: a new package's first one is published by
      # hand, since npm sets up a trusted publisher only for a package that exists.
      - name: Publish what npm does not have yet
        run: |
          for pkg in packages/brainyard packages/cli; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm already"
            else
              npm publish -w "$pkg" --access public
            fi
          done
