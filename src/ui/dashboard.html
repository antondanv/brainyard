<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainyard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #0c0e12;
  --panel: #14171d;
  --panel-2: #1b1f27;
  --border: #272c36;
  --text: #e7e9ee;
  --muted: #8c94a3;
  --faint: #5d6574;
  --accent: #7d8cff;
  --accent-ink: #0c0e12;
  --green: #3ecf8e;
  --yellow: #f2c14e;
  --red: #ff6b6b;
  --gray: #6b7280;
  --claude: #d9825b;
  --codex: #4fbf9f;
  --antigravity: #6ea8ff;
  --radius: 12px;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f0f2f5;
  --border: #e1e4ea;
  --text: #151820;
  --muted: #5d6675;
  --faint: #9aa2b1;
  --accent: #4452e0;
  --accent-ink: #ffffff;
  --green: #15935c;
  --yellow: #b7791f;
  --red: #d63b3b;
  --gray: #8a93a3;
  --claude: #c0643c;
  --codex: #178a6c;
  --antigravity: #2f6fdc;
  color-scheme: light;
}
* { box-sizing: border-box; }
/* biome-ignore lint/complexity/noImportantStyles: the hidden attribute must beat every display rule */
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 64px; }

header { display: flex; align-items: center; gap: 12px; padding: 22px 0 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; letter-spacing: -.01em; }
.brand svg { width: 28px; height: 28px; }
.brand .ver { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
header .grow { flex: 1; }
.btn { background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px; cursor: pointer; transition: border-color .15s, background .15s; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--red); }
.btn.icon { padding: 7px 10px; }

.summary { display: flex; align-items: baseline; gap: 10px; color: var(--muted); margin: 4px 0 14px; min-height: 22px; }
.summary strong { color: var(--text); font-size: 15px; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--brand, var(--accent)); opacity: .85; }
.card[data-brain="claude"] { --brand: var(--claude); }
.card[data-brain="codex"] { --brand: var(--codex); }
.card[data-brain="antigravity"] { --brand: var(--antigravity); }
.card-head { display: flex; align-items: center; gap: 10px; }
.mono { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; background: color-mix(in srgb, var(--brand) 18%, transparent); color: var(--brand); flex: none; }
.card h3 { margin: 0; font-size: 15px; font-weight: 650; }
.card .vendor { color: var(--muted); font-size: 12px; }
.badge { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.s-ready .badge { color: var(--green); }
.s-needs_login .badge, .s-limited .badge, .s-unknown .badge { color: var(--yellow); }
.s-error .badge { color: var(--red); }
.s-not_installed .badge { color: var(--gray); }
.s-not_installed { opacity: .82; }
.kv { display: grid; grid-template-columns: 74px 1fr; gap: 3px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv code { font: 12px var(--mono); color: var(--muted); }
.caps { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.caps li { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--panel-2); color: var(--faint); border: 1px solid var(--border); }
.caps li.on { color: var(--text); }
.caps li.on::before { content: "✓ "; color: var(--green); }
.fix { display: flex; gap: 8px; align-items: flex-start; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; font: 12px/1.45 var(--mono); }
.fix span { flex: 1; overflow-wrap: anywhere; }
.fix button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font: 12px var(--sans); }
.ping { font-size: 13px; color: var(--muted); }
.ping b { color: var(--text); font-weight: 600; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 64px 1fr 38px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.bar .track { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar .fill { height: 100%; background: var(--green); border-radius: 99px; }
.bar .fill.warn { background: var(--yellow); }
.bar .fill.full { background: var(--red); }
details.models summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
details.models summary::-webkit-details-marker { display: none; }
details.models summary::before { content: "▸ "; }
details.models[open] summary::before { content: "▾ "; }
details.models table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12.5px; }
details.models td { padding: 3px 0; border-top: 1px solid var(--border); vertical-align: top; }
details.models td:first-child { font-family: var(--mono); font-size: 12px; padding-right: 10px; white-space: nowrap; }
details.models td:last-child { color: var(--muted); }
.skeleton { height: 214px; background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius); border: 1px solid var(--border); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

h2 { font-size: 15px; margin: 34px 0 12px; font-weight: 650; display: flex; align-items: baseline; gap: 10px; }
h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
.play { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.field select, .field input[type=text] { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; min-width: 130px; color: var(--text); }
.field.wide { flex: 1; min-width: 220px; }
.field.wide input { width: 100%; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 2px; margin: 0; min-inline-size: 0; }
.seg button { background: none; border: 0; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--border); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); padding-bottom: 7px; cursor: pointer; }
textarea { width: 100%; min-height: 96px; resize: vertical; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; color: var(--text); line-height: 1.5; }
textarea:focus, select:focus, input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
.submit-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.submit-row .note { color: var(--muted); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.chip button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }

.session { display: grid; gap: 10px; }
.run { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.run-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
.run-head .title { font-weight: 600; }
.run-head .prompt { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.run-head .clock { font: 12px var(--mono); color: var(--muted); }
.feed { list-style: none; margin: 0; padding: 8px 0; max-height: 420px; overflow: auto; font: 12.5px/1.55 var(--mono); }
.feed li { display: grid; grid-template-columns: 44px 18px 1fr; gap: 6px; padding: 1px 14px; }
.feed .t { color: var(--faint); }
.feed .m { text-align: center; color: var(--faint); }
.feed .s { overflow-wrap: anywhere; white-space: pre-wrap; }
.k-message .s { color: var(--text); font-family: var(--sans); font-size: 13px; }
.k-message .m { color: var(--accent); }
.k-init .s, .k-init .m { color: var(--antigravity); }
.k-hint .s, .k-hint .m { color: var(--claude); }
.k-warning .s, .k-warning .m { color: var(--yellow); }
.k-error .s, .k-error .m, .k-denied .s, .k-denied .m, .k-stopped .s, .k-stopped .m, .is-error .s, .is-error .m { color: var(--red); }
.k-done .s, .k-done .m { color: var(--green); }
.k-done.failed .s, .k-done.failed .m { color: var(--red); }
.k-thinking .s, .k-tool_result .s { color: var(--muted); }
.steer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
.steer input { flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
.answer { padding: 14px; border-top: 1px solid var(--border); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
.answer.error { color: var(--red); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); align-items: center; }
.stats b { color: var(--text); font-weight: 600; }
.stats .grow { flex: 1; }
.stats .link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
.banner { background: color-mix(in srgb, var(--yellow) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--yellow) 45%, var(--border)); border-radius: var(--radius); padding: 12px 14px; margin: 6px 0 14px; }
.banner.error { background: color-mix(in srgb, var(--red) 12%, var(--panel)); border-color: color-mix(in srgb, var(--red) 45%, var(--border)); }
.empty { color: var(--muted); font-size: 13px; padding: 4px 2px; }
footer { color: var(--faint); font-size: 12px; margin-top: 40px; text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 560px) {
  .wrap { padding: 0 14px 48px; }
  header { flex-wrap: wrap; }
  .field select, .field input[type=text] { min-width: 0; width: 100%; }
  .field { flex: 1 1 140px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><circle cx="9" cy="16" r="3.2" fill="var(--accent-ink)"/><circle cx="16" cy="16" r="3.2" fill="var(--accent-ink)" fill-opacity=".8"/><circle cx="23" cy="16" r="3.2" fill="var(--accent-ink)" fill-opacity=".6"/></svg>
      Brainyard <span class="ver">{{VERSION}}</span>
    </div>
    <div class="grow"></div>
    <button class="btn" id="refresh" type="button" title="Check again (free)">Refresh</button>
    <button class="btn" id="live" type="button" title="One tiny real call per installed CLI — costs a fraction of a cent">Live check</button>
    <button class="btn icon" id="theme" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
  </header>

  <div id="banner"></div>
  <div class="summary" id="summary" aria-live="polite"></div>
  <section class="cards" id="cards" aria-label="Agent CLIs">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </section>

  <h2>Playground <small>ask a question, or give an agent a task and watch it work</small></h2>
  <form class="play" id="form" autocomplete="off">
    <div class="controls">
      <label class="field">Brain <select id="brain"></select></label>
      <div class="field">Mode
        <fieldset class="seg" aria-label="Mode">
          <button type="button" data-mode="ask" aria-pressed="true">Ask</button>
          <button type="button" data-mode="run" aria-pressed="false">Agent</button>
        </fieldset>
      </div>
      <label class="field">Model <select id="model"></select></label>
      <label class="field">Effort <select id="effort"></select></label>
      <label class="field" data-for="run">Access
        <select id="access">
          <option value="workspace">workspace</option>
          <option value="readonly">read-only</option>
          <option value="full">full</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="web"> Web</label>
    </div>
    <label class="field wide" data-for="run">Folder <input type="text" id="cwd" placeholder="empty: a new temporary folder" spellcheck="false"></label>
    <label class="sr" for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="Ask something, or give the agent a task…"></textarea>
    <div class="submit-row">
      <button class="btn primary" id="go" type="submit">Run</button>
      <span id="resume"></span>
      <span class="note" id="note">⌘/Ctrl + Enter</span>
    </div>
  </form>

  <h2 id="session-title" hidden>This session</h2>
  <div class="session" id="session"></div>
  <footer>Brainyard runs locally. The agents run on this machine, with your CLIs and your accounts.</footer>
</div>

<script>
'use strict';
(() => {
  const $ = (id) => document.getElementById(id);
  const h = (tag, props, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'dataset') Object.assign(node.dataset, value);
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : String(value));
    }
    for (const child of children.flat(Number.POSITIVE_INFINITY)) {
      if (child === undefined || child === null || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  };
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch { /* private mode */ } },
  };

  // ----- theme -------------------------------------------------------------
  const setTheme = (theme) => { document.documentElement.dataset.theme = theme; store.set('brainyard.theme', theme); };
  setTheme(store.get('brainyard.theme') || 'dark');
  $('theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

  // ----- token: from the #fragment, kept for this tab only -------------------
  const token = (() => {
    const found = /token=([^&]+)/.exec(location.hash);
    if (found) {
      try { sessionStorage.setItem('brainyard.token', found[1]); } catch { /* ignore */ }
      history.replaceState(null, '', location.pathname);
      return found[1];
    }
    try { return sessionStorage.getItem('brainyard.token') || ''; } catch { return ''; }
  })();

  const banner = (text, kind) => {
    const box = $('banner');
    box.replaceChildren();
    if (text) box.append(h('div', { class: `banner ${kind || ''}` }, text));
  };

  async function api(path, options = {}) {
    const init = { method: options.method || 'GET', headers: { Authorization: `Bearer ${token}` } };
    if (options.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(options.body);
    }
    const res = await fetch(path, init);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const error = new Error((data.error?.message) || res.statusText);
      error.kind = data.error?.kind;
      error.fix = data.error?.fix;
      error.status = res.status;
      throw error;
    }
    return data;
  }

  // ----- status ------------------------------------------------------------
  const WORDS = { ready: 'ready', needs_login: 'sign in', limited: 'limited', unknown: 'unknown', not_installed: 'not installed', error: 'error' };
  const CAPS = [['steering', 'hints mid-run'], ['resume', 'resume'], ['mcp', 'MCP'], ['reportsCost', 'reports cost'], ['modelList', 'model list']];
  const state = { report: null, brains: {}, mode: 'ask', resume: null };

  function card(brain) {
    const letter = brain.label.slice(0, 1);
    const how = [brain.auth.method, brain.auth.plan].filter(Boolean).join(', ');
    const rows = [];
    if (brain.installed) {
      rows.push(['version', brain.version || '—']);
      let signed = { logged_in: 'signed in', logged_out: 'not signed in', unknown: 'not confirmed' }[brain.auth.state];
      if (how) signed += ` · ${how}`;
      if (brain.auth.account) signed += ` · ${brain.auth.account}`;
      rows.push(['account', signed]);
      if (brain.defaultModel) rows.push(['model', `${brain.defaultModel} (default)`]);
      if (brain.path) rows.push(['binary', h('code', {}, brain.path)]);
    }
    const node = h('article', { class: `card s-${brain.availability}`, dataset: { brain: brain.id } },
      h('div', { class: 'card-head' },
        h('div', { class: 'mono', 'aria-hidden': 'true' }, letter),
        h('div', {}, h('h3', {}, brain.label), h('div', { class: 'vendor' }, `${brain.vendor} · ${brain.binary}`)),
        h('span', { class: 'badge' }, WORDS[brain.availability] || brain.availability),
      ),
      rows.length ? h('dl', { class: 'kv' }, rows.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])) : null,
    );
    if (brain.ping) {
      if (brain.ping.ok) {
        const cost = brain.ping.costUsd === null ? '' : ` · $${brain.ping.costUsd.toFixed(4)}`;
        node.append(h('div', { class: 'ping' }, 'live: answered ', h('b', {}, `“${brain.ping.text}”`), ` in ${(brain.ping.ms / 1000).toFixed(1)}s${cost}${brain.ping.model ? ` · ${brain.ping.model}` : ''}`));
      } else if (brain.ping.error) {
        node.append(h('div', { class: 'ping' }, 'live: ', h('b', {}, brain.ping.error.kind), ` — ${brain.ping.error.message}`));
      }
      const windows = brain.ping.limits || [];
      if (windows.length) {
        node.append(h('div', { class: 'bars' }, windows.map((w) => {
          const pct = Math.round(w.utilization * 100);
          const resets = w.resetsAt ? ` · resets ${new Date(w.resetsAt * 1000).toLocaleString()}` : '';
          return h('div', { class: 'bar', title: `${w.window}: ${pct}% used${resets}` },
            h('span', {}, w.window.replace('_', '-')),
            h('div', { class: 'track' }, h('div', { class: `fill ${pct >= 90 ? 'full' : pct >= 70 ? 'warn' : ''}`, style: `width:${Math.min(100, pct)}%` })),
            h('span', {}, `${pct}%`));
        })));
      }
    }
    node.append(h('ul', { class: 'caps', 'aria-label': 'Capabilities' },
      CAPS.map(([key, label]) => h('li', { class: brain.capabilities[key] ? 'on' : '' }, label))));
    if (brain.models?.models.length) {
      node.append(h('details', { class: 'models' },
        h('summary', {}, `${brain.models.models.length} models${brain.models.source === 'builtin' ? ' (built-in list)' : ''}`),
        h('table', {}, h('tbody', {}, brain.models.models.map((m) => h('tr', {},
          h('td', {}, m.id),
          h('td', {}, m.efforts.length ? m.efforts.join(' · ') + (m.defaultEffort ? ` (default ${m.defaultEffort})` : '') : 'no effort setting')))))));
    }
    if (brain.fix && brain.availability !== 'ready') {
      const text = brain.fix;
      node.append(h('div', { class: 'fix' }, h('span', {}, text),
        h('button', { type: 'button', onclick: (e) => { navigator.clipboard?.writeText(text); e.target.textContent = 'copied'; } }, 'copy')));
    }
    return node;
  }

  async function loadStatus(live) {
    $('refresh').disabled = true;
    $('live').disabled = true;
    $('summary').textContent = live ? 'Checking with a real call to each CLI…' : 'Checking…';
    try {
      const report = await api(`/api/status${live ? '?live=1' : ''}`);
      state.report = report;
      state.brains = Object.fromEntries(report.brains.map((b) => [b.id, b]));
      $('cards').replaceChildren(...report.brains.map(card));
      const at = new Date(report.checkedAt).toLocaleTimeString();
      $('summary').replaceChildren(
        h('strong', {}, `${report.ready.length} of ${report.brains.length} ready`),
        h('span', {}, `checked ${at}${live ? ' with live calls' : ''} · Node ${report.node} · ${report.platform}`));
      fillBrains();
      banner('');
    } catch (error) {
      $('summary').textContent = '';
      $('cards').replaceChildren();
      if (error.status === 401) banner('This page needs the access token. Open the link printed in the terminal where you ran `brainyard ui`.', 'error');
      else banner(`Could not check: ${error.message}`, 'error');
    } finally {
      $('refresh').disabled = false;
      $('live').disabled = false;
    }
  }
  $('refresh').addEventListener('click', () => loadStatus(false));
  $('live').addEventListener('click', () => loadStatus(true));

  // ----- playground controls -------------------------------------------------
  function fillBrains() {
    const select = $('brain');
    const previous = select.value || store.get('brainyard.brain');
    const installed = state.report.brains.filter((b) => b.installed);
    select.replaceChildren(...installed.map((b) => h('option', { value: b.id }, `${b.label}${b.availability === 'ready' ? '' : ` (${WORDS[b.availability]})`}`)));
    if (!installed.length) select.append(h('option', { value: '' }, 'no CLI installed'));
    if (previous && installed.some((b) => b.id === previous)) select.value = previous;
    fillModels();
  }

  function catalog() {
    const brain = state.brains[$('brain').value];
    return brain?.models;
  }

  function fillModels() {
    const models = catalog();
    const select = $('model');
    select.replaceChildren(h('option', { value: '' }, 'default'));
    for (const m of (models?.models) || []) select.append(h('option', { value: m.id }, m.label && m.label !== m.id ? `${m.id} — ${m.label}` : m.id));
    fillEfforts();
    updateMode();
  }

  function fillEfforts() {
    const models = catalog();
    const chosen = models?.models.find((m) => m.id === $('model').value);
    const efforts = chosen ? chosen.efforts : ((models?.defaultEfforts) || []);
    const select = $('effort');
    select.replaceChildren(h('option', { value: '' }, chosen?.defaultEffort ? `default (${chosen.defaultEffort})` : 'default'));
    for (const e of efforts) select.append(h('option', { value: e }, e));
    select.disabled = efforts.length === 0;
  }

  $('brain').addEventListener('change', () => { store.set('brainyard.brain', $('brain').value); state.resume = null; showResume(); fillModels(); });
  $('model').addEventListener('change', fillEfforts);

  function updateMode() {
    for (const button of document.querySelectorAll('.seg button')) button.setAttribute('aria-pressed', String(button.dataset.mode === state.mode));
    for (const node of document.querySelectorAll('[data-for="run"]')) node.hidden = state.mode !== 'run';
    $('prompt').placeholder = state.mode === 'run' ? 'Give the agent a task — it works in the folder above…' : 'Ask something…';
    $('go').textContent = state.mode === 'run' ? 'Start agent' : 'Ask';
  }
  for (const button of document.querySelectorAll('.seg button')) {
    button.addEventListener('click', () => { state.mode = button.dataset.mode; if (state.mode === 'ask') { state.resume = null; showResume(); } updateMode(); });
  }

  function showResume() {
    const box = $('resume');
    box.replaceChildren();
    if (!state.resume) return;
    box.append(h('span', { class: 'chip' }, `continuing ${state.resume.slice(0, 8)}…`,
      h('button', { type: 'button', title: 'Start a new conversation', onclick: () => { state.resume = null; showResume(); } }, '✕')));
  }

  $('prompt').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); $('form').requestSubmit(); }
  });

  // ----- running ----------------------------------------------------------------
  const MARKS = { init: '◆', message: '›', thinking: '…', tool_call: '▸', command: '$', file_write: '✎', tool_result: '←', hint: '☞', denied: '⊘', warning: '!', error: '✗', stopped: '■', done: '✓' };
  const labelOf = (id) => (state.brains[id]?.label) || id;

  function panel(brainId, prompt) {
    $('session-title').hidden = false;
    const started = Date.now();
    const clock = h('span', { class: 'clock' }, '0.0s');
    const timer = setInterval(() => { clock.textContent = `${((Date.now() - started) / 1000).toFixed(1)}s`; }, 100);
    const head = h('div', { class: 'run-head' }, h('span', { class: 'title' }, labelOf(brainId)), h('span', { class: 'prompt', title: prompt }, prompt), clock);
    const node = h('section', { class: 'run' }, head);
    $('session').prepend(node);
    return { node, head, started, clock, stopTimer: () => clearInterval(timer) };
  }

  function stats(result) {
    const parts = [];
    parts.push(h('span', {}, h('b', {}, `${(result.durationMs / 1000).toFixed(1)}s`)));
    if (result.costUsd !== null && result.costUsd !== undefined) parts.push(h('span', {}, h('b', {}, `$${result.costUsd.toFixed(4)}`), result.costSource === 'estimate' ? ' est.' : ''));
    if (result.model) parts.push(h('span', {}, result.model));
    const u = result.usage || {};
    const tokens = (u.inputTokens || 0) + (u.cacheReadTokens || 0) + (u.cacheWriteTokens || 0);
    parts.push(h('span', {}, `${tokens.toLocaleString()} in · ${(u.outputTokens || 0).toLocaleString()} out`));
    if (result.toolCalls !== undefined) parts.push(h('span', {}, `${result.toolCalls} actions`));
    return parts;
  }

  async function doAsk(body) {
    const view = panel(body.brain, body.prompt);
    const answer = h('div', { class: 'answer' }, h('span', { class: 'note' }, 'Thinking…'));
    view.node.append(answer);
    try {
      const result = await api('/api/ask', { method: 'POST', body });
      answer.replaceChildren(result.text);
      view.node.append(h('div', { class: 'stats' }, stats(result)));
    } catch (error) {
      answer.className = 'answer error';
      answer.replaceChildren(`${error.kind || 'error'}: ${error.message}`, error.fix ? `\n→ ${error.fix}` : '');
    } finally {
      view.stopTimer();
    }
  }

  async function doRun(body) {
    let created;
    try {
      created = await api('/api/runs', { method: 'POST', body });
    } catch (error) {
      const view = panel(body.brain, body.prompt);
      view.stopTimer();
      view.node.append(h('div', { class: 'answer error' }, `${error.kind || 'error'}: ${error.message}${error.fix ? `\n→ ${error.fix}` : ''}`));
      return;
    }
    const view = panel(body.brain, body.prompt);
    const feed = h('ol', { class: 'feed', 'aria-live': 'polite' });
    const stop = h('button', { class: 'btn danger', type: 'button', onclick: () => api(`/api/runs/${created.id}/stop`, { method: 'POST', body: {} }).catch(() => {}) }, 'Stop');
    view.head.append(stop);
    view.node.append(feed);
    let steer = null;
    if (created.steerable) {
      const input = h('input', { type: 'text', placeholder: 'Message the agent while it works…', 'aria-label': 'Hint' });
      const send = async () => {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        await api(`/api/runs/${created.id}/hint`, { method: 'POST', body: { text } }).catch(() => {});
      };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
      steer = h('div', { class: 'steer' }, input, h('button', { class: 'btn', type: 'button', onclick: send }, 'Send'));
      view.node.append(steer);
    }
    const add = (event) => {
      const offset = Math.max(0, (Date.parse(event.at) - view.started) / 1000);
      const failed = event.kind === 'done' && event.data && event.data.ok === false;
      const classes = [`k-${event.kind}`, event.data?.isError ? 'is-error' : '', failed ? 'failed' : ''].join(' ');
      const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
      feed.append(h('li', { class: classes }, h('span', { class: 't' }, `${offset.toFixed(1)}s`), h('span', { class: 'm' }, failed ? '✗' : MARKS[event.kind] || '·'), h('span', { class: 's' }, event.summary)));
      if (nearBottom) feed.scrollTop = feed.scrollHeight;
    };
    try {
      await follow(created.id, (name, data) => {
        if (name === 'agent' && data.feed) add(data);
        if (name === 'result') finish(data);
        if (name === 'failure') view.node.append(h('div', { class: 'answer error' }, `${data.error.kind}: ${data.error.message}`));
      });
    } catch (error) {
      view.node.append(h('div', { class: 'answer error' }, `stream lost: ${error.message}`));
    } finally {
      view.stopTimer();
      stop.remove();
      if (steer) steer.remove();
    }

    function finish(result) {
      if (result.text?.trim()) view.node.append(h('div', { class: 'answer' }, result.text.trim()));
      else if (!result.ok && result.error) view.node.append(h('div', { class: 'answer error' }, `${result.error.kind}: ${result.error.message}`));
      const folder = created.cwd.split(/[\\/]/).filter(Boolean).pop() || created.cwd;
      const copy = h('button', { class: 'link', type: 'button', title: created.cwd, onclick: (e) => { navigator.clipboard?.writeText(created.cwd); e.target.textContent = 'copied'; } }, 'copy path');
      const row = h('div', { class: 'stats' }, stats(result), h('span', { class: 'grow' }), h('span', { title: created.cwd }, `folder …/${folder}`), copy);
      if (result.sessionId) {
        row.append(h('button', { class: 'btn', type: 'button', onclick: () => {
          state.mode = 'run'; state.resume = result.sessionId;
          $('brain').value = body.brain; fillModels(); $('cwd').value = created.cwd; updateMode(); showResume(); $('prompt').focus();
        } }, 'Continue'));
      }
      view.node.append(row);
    }
  }

  async function follow(id, onEvent) {
    const res = await fetch(`/api/runs/${id}/events`, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok || !res.body) throw new Error(res.statusText || 'no stream');
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      for (let cut = buffer.indexOf('\n\n'); cut >= 0; cut = buffer.indexOf('\n\n')) {
        const chunk = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        let name = 'message';
        let data = '';
        for (const line of chunk.split('\n')) {
          if (line.startsWith('event: ')) name = line.slice(7);
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (data) onEvent(name, JSON.parse(data));
      }
    }
  }

  $('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const prompt = $('prompt').value.trim();
    const brain = $('brain').value;
    if (!prompt || !brain) { $('prompt').focus(); return; }
    const body = { brain, prompt };
    if ($('model').value) body.model = $('model').value;
    if ($('effort').value) body.effort = $('effort').value;
    body.web = $('web').checked;
    $('prompt').value = '';
    if (state.mode === 'ask') {
      await doAsk(body);
    } else {
      body.access = $('access').value;
      if ($('cwd').value.trim()) body.cwd = $('cwd').value.trim();
      if (state.resume) body.resume = state.resume;
      await doRun(body);
    }
  });

  updateMode();
  if (!token) banner('This page needs the access token. Open the link printed in the terminal where you ran `brainyard ui`.', 'error');
  else loadStatus(false);
})();
</script>
</body>
</html>
