<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainyard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #0b0d11;
  --raise: #12151b;
  --hover: #1b2029;
  --line: #2a2f3a;
  --text: #d4d8e1;
  --bright: #f5f7fa;
  --muted: #858d9c;
  --faint: #5b6372;
  --accent: #7d8cff;
  --accent-ink: #0b0d11;
  --green: #5ad08a;
  --yellow: #e6c46e;
  --red: #ff6b6b;
  --blue: #6ea8ff;
  --magenta: #c792ea;
  --cyan: #5ccfe0;
  --gray: #6b7280;
  --claude: #e08a5f;
  --codex: #4fbf9f;
  --antigravity: #6ea8ff;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #fbfaf7;
  --raise: #f3f1eb;
  --hover: #e9e6de;
  --line: #d8d4c9;
  --text: #25282e;
  --bright: #0d0f12;
  --muted: #6b6f78;
  --faint: #9d9b95;
  --accent: #4452e0;
  --accent-ink: #ffffff;
  --green: #17804a;
  --yellow: #9a6a00;
  --red: #cc3b36;
  --blue: #2f6fdc;
  --magenta: #8b4fd1;
  --cyan: #137f8b;
  --gray: #8a8f99;
  --claude: #c0643c;
  --codex: #178a6c;
  --antigravity: #2f6fdc;
  color-scheme: light;
}
* { box-sizing: border-box; }
/* biome-ignore lint/complexity/noImportantStyles: the hidden attribute must beat every display rule */
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.6 var(--mono); font-variant-ligatures: none; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
::selection { background: color-mix(in srgb, var(--accent) 38%, transparent); }
::placeholder { color: var(--faint); opacity: 1; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 40px; }
.grow { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ----- chrome: header, buttons, prompt-line headings --------------------- */
header { display: flex; align-items: center; gap: 6px; padding: 16px 0 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 1ch; font-weight: 700; color: var(--bright); }
.logo { color: var(--accent); }
.logo span:nth-child(2) { opacity: .75; }
.logo span:nth-child(3) { opacity: .5; }
.brand .ver { color: var(--muted); font-weight: 400; }
.btn { background: none; border: 0; border-radius: 3px; padding: 1px 4px; cursor: pointer; white-space: nowrap; color: var(--text); }
.btn::before { content: "[ "; color: var(--faint); }
.btn::after { content: " ]"; color: var(--faint); }
.btn:hover:not(:disabled) { background: var(--hover); color: var(--bright); }
.btn:active:not(:disabled) { background: var(--text); color: var(--bg); }
.btn:disabled { color: var(--faint); cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 2px 14px; }
.btn.primary::before, .btn.primary::after { content: none; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 82%, var(--bright)); color: var(--accent-ink); }
.btn.danger { color: var(--red); }

h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 1ch; margin: 36px 0 4px; font-size: inherit; font-weight: 700; color: var(--bright); }
header + h2 { margin-top: 24px; }
h2 .ps1 { color: var(--accent); }
h2 small { font-size: inherit; font-weight: 400; color: var(--faint); }
.summary { color: var(--muted); min-height: 1.6em; }
.summary strong { color: var(--bright); }
.busy { color: var(--muted); }
.busy::before { content: "⠋"; display: inline-block; width: 2ch; color: var(--accent); animation: spin .8s step-end infinite; }
@keyframes spin {
  0% { content: "⠋"; }
  10% { content: "⠙"; }
  20% { content: "⠹"; }
  30% { content: "⠸"; }
  40% { content: "⠼"; }
  50% { content: "⠴"; }
  60% { content: "⠦"; }
  70% { content: "⠧"; }
  80% { content: "⠇"; }
  90% { content: "⠏"; }
}
@keyframes blink { 50% { opacity: 0; } }
.banner { border: 1px solid color-mix(in srgb, var(--yellow) 50%, var(--line)); border-radius: 6px; color: var(--yellow); padding: 8px 12px; margin: 8px 0 4px; }
.banner::before { content: "! "; }
.banner.error { border-color: color-mix(in srgb, var(--red) 50%, var(--line)); color: var(--red); }
.banner.error::before { content: "✗ "; }

/* ----- panels: a box with its title on the top border, like a TUI -------- */
.panel { position: relative; border: 1px solid var(--line); border-radius: 6px; }
.legend { position: absolute; top: 0; left: 10px; right: 10px; transform: translateY(-50%); display: flex; align-items: center; line-height: 1.3; white-space: nowrap; }
.legend > * { background: var(--bg); padding: 0 1ch; }
.legend > * + * { margin-left: 1ch; }
.legend > .grow { background: none; padding: 0; min-width: 1ch; }
[data-brain="claude"] { --brand: var(--claude); }
[data-brain="codex"] { --brand: var(--codex); }
[data-brain="antigravity"] { --brand: var(--antigravity); }

/* ----- status cards ------------------------------------------------------ */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px 16px; margin-top: 20px; }
@media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }
.cards[aria-busy="true"] > .card { opacity: .55; }
.card { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 12px; border-color: color-mix(in srgb, var(--brand, var(--line)) 45%, var(--line)); transition: opacity .2s; }
.card h3 { margin: 0; font-size: inherit; font-weight: 700; color: var(--brand, var(--bright)); }
.vendor { color: var(--muted); }
.badge { flex: none; }
.badge::before { content: "● "; }
.s-ready .badge { color: var(--green); }
.s-needs_login .badge, .s-limited .badge, .s-unknown .badge { color: var(--yellow); }
.s-error .badge { color: var(--red); }
.s-not_installed .badge { color: var(--gray); }
.card.s-not_installed { border-color: var(--line); opacity: .72; }
.kv { display: grid; grid-template-columns: 8ch minmax(0, 1fr); gap: 0 1ch; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv code { font: inherit; color: var(--muted); }
.ping { color: var(--muted); overflow-wrap: anywhere; }
.ping b { color: var(--bright); font-weight: 400; }
.bar { display: flex; gap: 1ch; color: var(--muted); white-space: nowrap; }
.bar .label { min-width: 10ch; }
.meter { color: var(--faint); overflow: hidden; }
.meter .fill { color: var(--green); }
.meter .fill.warn { color: var(--yellow); }
.meter .fill.full { color: var(--red); }
.caps { display: flex; flex-wrap: wrap; gap: 0 2ch; margin: 0; padding: 0; list-style: none; color: var(--faint); }
.caps li::before { content: "·"; display: inline-block; width: 2ch; }
.caps li.on { color: var(--text); }
.caps li.on::before { content: "✓"; color: var(--green); }
details.models summary { width: fit-content; cursor: pointer; color: var(--muted); list-style: none; }
details.models summary::-webkit-details-marker { display: none; }
details.models summary::before { content: "▸ "; }
details.models[open] summary::before { content: "▾ "; }
details.models summary:hover { color: var(--text); }
details.models table { width: 100%; border-collapse: collapse; margin-top: 2px; }
details.models td { padding: 0; vertical-align: top; }
details.models td:first-child { white-space: nowrap; padding-right: 2ch; }
details.models td:first-child::before { content: "├─ "; color: var(--faint); }
details.models tr:last-child td:first-child::before { content: "└─ "; }
details.models td:last-child { color: var(--muted); }
.fix { display: flex; gap: 1ch; align-items: flex-start; }
.fix::before { content: "→"; color: var(--yellow); }
.fix span { flex: 1; overflow-wrap: anywhere; }
.fix button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.skeleton { min-height: 15.5em; padding: 14px 16px; border-style: dashed; }

/* ----- playground -------------------------------------------------------- */
.play { display: grid; gap: 12px; margin-top: 10px; padding: 14px 16px 16px; transition: border-color .15s; }
.play:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 3ch; }
.field { display: inline-flex; align-items: center; gap: 1ch; color: var(--muted); }
.select { position: relative; display: inline-flex; min-width: 0; }
.select::after { content: "▾"; position: absolute; right: 1ch; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
select, input[type="text"], textarea { background: var(--raise); border: 1px solid var(--line); border-radius: 4px; color: var(--text); }
select { appearance: none; max-width: 100%; padding: 2px 3ch 2px 1ch; cursor: pointer; text-overflow: ellipsis; }
select:disabled { color: var(--faint); cursor: default; }
input[type="text"] { padding: 2px 1ch; }
select:focus, input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
.seg { display: inline-flex; margin: 0; padding: 0; min-inline-size: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 2px 1.5ch; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--text); }
.seg button:focus-visible { outline-offset: -3px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.check { position: relative; display: inline-flex; align-items: center; gap: 1ch; cursor: pointer; }
.check input { position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
.tick::before { content: "[ ]"; color: var(--muted); white-space: pre; }
.check:hover .tick::before { color: var(--text); }
.check input:checked + .tick::before { content: "[x]"; color: var(--green); }
.check input:focus-visible + .tick { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.field.wide { display: flex; }
.field.wide input { flex: 1; min-width: 0; }
textarea { display: block; width: 100%; min-height: 7em; resize: vertical; padding: 8px 1.5ch; line-height: 1.6; caret-color: var(--accent); }
.submit-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 2ch; }
.note { color: var(--faint); }
.chip { display: inline-flex; align-items: center; gap: 1ch; padding: 0 1ch; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 3px; color: var(--accent); }
.chip button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }

/* ----- session: one panel per ask or run --------------------------------- */
.session { display: grid; gap: 28px; margin-top: 20px; }
.run { padding-top: 12px; transition: border-color .2s; }
.run.live { border-color: color-mix(in srgb, var(--brand, var(--accent)) 60%, var(--line)); }
.run-head .title { flex: none; font-weight: 700; color: var(--brand, var(--bright)); }
.run-head .prompt { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.run-head .clock { flex: none; color: var(--muted); }
.run-head .btn { flex: none; }
.feed { list-style: none; margin: 0; padding: 4px 0 10px; max-height: 420px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.feed li { display: grid; grid-template-columns: 6ch 2ch minmax(0, 1fr); column-gap: 1ch; padding: 0 16px; }
.feed .t { color: var(--faint); text-align: right; }
.feed .m { color: var(--gray); text-align: center; }
.feed .s { overflow-wrap: anywhere; white-space: pre-wrap; }
.run.live .feed::after { content: ""; display: block; width: 1ch; height: 1.3em; margin: 2px 0 0 calc(16px + 10ch); background: var(--accent); animation: blink 1s step-end infinite; }
.k-message .m { color: var(--cyan); }
.k-init .s, .k-init .m { color: var(--blue); }
.k-hint .s, .k-hint .m { color: var(--magenta); }
.k-warning .s, .k-warning .m { color: var(--yellow); }
.k-thinking .s, .k-thinking .m, .k-tool_result .s, .k-tool_result .m { color: var(--muted); }
.k-error .s, .k-error .m, .k-denied .s, .k-denied .m, .k-stopped .s, .k-stopped .m, .is-error .s, .is-error .m { color: var(--red); }
.k-done .s, .k-done .m { color: var(--green); }
.k-done.failed .s, .k-done.failed .m { color: var(--red); }
.steer { display: flex; align-items: center; gap: 1ch; padding: 8px 16px; border-top: 1px dashed var(--line); }
.steer::before { content: "☞"; color: var(--magenta); }
.steer input { flex: 1; min-width: 0; }
.answer { padding: 10px 16px 12px; border-top: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--bright); }
.run-head + .answer { border-top: 0; }
.answer.error { color: var(--red); }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 2ch; padding: 5px 16px; border-top: 1px solid var(--line); border-radius: 0 0 5px 5px; background: var(--raise); color: var(--muted); }
.stats b { color: var(--bright); }
.stats .where { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 2ch; margin-left: auto; }
.stats .link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.stats .link:hover { text-decoration: underline; }
footer { margin-top: 48px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--faint); }
@media (max-width: 560px) {
  .wrap { padding: 0 14px 32px; }
  header { flex-wrap: wrap; }
  header .brand { flex: 1 1 100%; }
  header .grow { display: none; }
  .controls { gap: 8px 2ch; }
  .field:not(.check) { flex: 1 1 100%; }
  .field > span:first-child { min-width: 7ch; }
  .field .select { flex: 1; }
  .field select { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .busy::before, .run.live .feed::after { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true"><span>●</span><span>●</span><span>●</span></span>
      brainyard <span class="ver">{{VERSION}}</span>
    </div>
    <div class="grow"></div>
    <button class="btn" id="refresh" type="button" title="Check again (free)">refresh</button>
    <button class="btn" id="live" type="button" title="One tiny real call per installed CLI — costs a fraction of a cent">live check</button>
    <button class="btn" id="theme" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
  </header>

  <h2><span class="ps1" aria-hidden="true">❯</span> <span id="status-cmd">brainyard status</span></h2>
  <div id="banner"></div>
  <div class="summary" id="summary" aria-live="polite"></div>
  <section class="cards" id="cards" aria-label="Agent CLIs">
    <div class="panel skeleton"><span class="busy">checking</span></div>
    <div class="panel skeleton"><span class="busy">checking</span></div>
    <div class="panel skeleton"><span class="busy">checking</span></div>
  </section>

  <h2><span class="ps1" aria-hidden="true">❯</span> <span id="play-cmd">brainyard ask</span> <small># ask a question, or give an agent a task and watch it work</small></h2>
  <form class="play panel" id="form" autocomplete="off">
    <div class="controls">
      <label class="field"><span>brain</span><span class="select"><select id="brain"></select></span></label>
      <div class="field"><span>mode</span>
        <fieldset class="seg" aria-label="Mode">
          <button type="button" data-mode="ask" aria-pressed="true">ask</button>
          <button type="button" data-mode="run" aria-pressed="false">agent</button>
        </fieldset>
      </div>
      <label class="field"><span>model</span><span class="select"><select id="model"></select></span></label>
      <label class="field"><span>effort</span><span class="select"><select id="effort"></select></span></label>
      <label class="field" data-for="run"><span>access</span><span class="select">
        <select id="access">
          <option value="workspace">workspace</option>
          <option value="readonly">read-only</option>
          <option value="full">full</option>
        </select>
      </span></label>
      <label class="field check"><input type="checkbox" id="web"><span class="tick" aria-hidden="true"></span>web</label>
    </div>
    <label class="field wide" data-for="run"><span>folder</span><input type="text" id="cwd" placeholder="empty: a new temporary folder" spellcheck="false"></label>
    <label class="sr" for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="Ask something…"></textarea>
    <div class="submit-row">
      <button class="btn primary" id="go" type="submit">ask</button>
      <span id="resume"></span>
      <span class="note" id="note">⌘/Ctrl + Enter</span>
    </div>
  </form>

  <h2 id="session-title" hidden><span class="ps1" aria-hidden="true">❯</span> history <small># this session</small></h2>
  <div class="session" id="session"></div>
  <footer># Brainyard runs locally. The agents run on this machine, with your CLIs and your accounts.</footer>
</div>

<script>
'use strict';
(() => {
  const $ = (id) => document.getElementById(id);
  const h = (tag, props, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'dataset') Object.assign(node.dataset, value);
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : String(value));
    }
    for (const child of children.flat(Number.POSITIVE_INFINITY)) {
      if (child === undefined || child === null || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  };
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch { /* private mode */ } },
  };

  // ----- theme -------------------------------------------------------------
  const setTheme = (theme) => { document.documentElement.dataset.theme = theme; store.set('brainyard.theme', theme); };
  setTheme(store.get('brainyard.theme') || 'dark');
  $('theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

  // ----- token: from the #fragment, kept for this tab only -------------------
  const token = (() => {
    const found = /token=([^&]+)/.exec(location.hash);
    if (found) {
      try { sessionStorage.setItem('brainyard.token', found[1]); } catch { /* ignore */ }
      history.replaceState(null, '', location.pathname);
      return found[1];
    }
    try { return sessionStorage.getItem('brainyard.token') || ''; } catch { return ''; }
  })();

  const banner = (text, kind) => {
    const box = $('banner');
    box.replaceChildren();
    if (text) box.append(h('div', { class: `banner ${kind || ''}` }, text));
  };

  async function api(path, options = {}) {
    const init = { method: options.method || 'GET', headers: { Authorization: `Bearer ${token}` } };
    if (options.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(options.body);
    }
    const res = await fetch(path, init);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const error = new Error((data.error?.message) || res.statusText);
      error.kind = data.error?.kind;
      error.fix = data.error?.fix;
      error.status = res.status;
      throw error;
    }
    return data;
  }

  // ----- status ------------------------------------------------------------
  const WORDS = { ready: 'ready', needs_login: 'sign in', limited: 'limited', unknown: 'unknown', not_installed: 'not installed', error: 'error' };
  const CAPS = [['steering', 'hints mid-run'], ['resume', 'resume'], ['mcp', 'MCP'], ['reportsCost', 'reports cost'], ['modelList', 'model list']];
  const METER = 20;
  const state = { report: null, brains: {}, mode: 'ask', resume: null };

  function card(brain) {
    const how = [brain.auth.method, brain.auth.plan].filter(Boolean).join(', ');
    const rows = [];
    if (brain.installed) {
      rows.push(['version', brain.version || '—']);
      let signed = { logged_in: 'signed in', logged_out: 'not signed in', unknown: 'not confirmed' }[brain.auth.state];
      if (how) signed += ` · ${how}`;
      if (brain.auth.account) signed += ` · ${brain.auth.account}`;
      rows.push(['account', signed]);
      if (brain.defaultModel) rows.push(['model', `${brain.defaultModel} (default)`]);
      if (brain.path) rows.push(['binary', h('code', {}, brain.path)]);
    }
    const node = h('article', { class: `card panel s-${brain.availability}`, dataset: { brain: brain.id } },
      h('div', { class: 'legend' },
        h('h3', {}, brain.label),
        h('span', { class: 'grow' }),
        h('span', { class: 'badge' }, WORDS[brain.availability] || brain.availability),
      ),
      h('div', { class: 'vendor' }, `${brain.vendor} · ${brain.binary}`),
      rows.length ? h('dl', { class: 'kv' }, rows.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])) : null,
    );
    if (brain.ping) {
      if (brain.ping.ok) {
        const cost = brain.ping.costUsd === null ? '' : ` · $${brain.ping.costUsd.toFixed(4)}`;
        node.append(h('div', { class: 'ping' }, 'live: answered ', h('b', {}, `“${brain.ping.text}”`), ` in ${(brain.ping.ms / 1000).toFixed(1)}s${cost}${brain.ping.model ? ` · ${brain.ping.model}` : ''}`));
      } else if (brain.ping.error) {
        node.append(h('div', { class: 'ping' }, 'live: ', h('b', {}, brain.ping.error.kind), ` — ${brain.ping.error.message}`));
      }
      const windows = brain.ping.limits || [];
      if (windows.length) {
        node.append(h('div', { class: 'bars' }, windows.map((w) => {
          const pct = Math.round(w.utilization * 100);
          const cells = Math.max(0, Math.min(METER, Math.round((pct / 100) * METER)));
          const resets = w.resetsAt ? ` · resets ${new Date(w.resetsAt * 1000).toLocaleString()}` : '';
          return h('div', { class: 'bar', title: `${w.window}: ${pct}% used${resets}` },
            h('span', { class: 'label' }, w.window.replace('_', '-')),
            h('span', { class: 'meter', 'aria-hidden': 'true' },
              h('span', { class: `fill ${pct >= 90 ? 'full' : pct >= 70 ? 'warn' : ''}` }, '█'.repeat(cells)), '░'.repeat(METER - cells)),
            h('span', {}, `${pct}%`));
        })));
      }
    }
    node.append(h('ul', { class: 'caps', 'aria-label': 'Capabilities' },
      CAPS.map(([key, label]) => h('li', { class: brain.capabilities[key] ? 'on' : '' }, label))));
    if (brain.models?.models.length) {
      node.append(h('details', { class: 'models' },
        h('summary', {}, `${brain.models.models.length} models${brain.models.source === 'builtin' ? ' (built-in list)' : ''}`),
        h('table', {}, h('tbody', {}, brain.models.models.map((m) => h('tr', {},
          h('td', {}, m.id),
          h('td', {}, m.efforts.length ? m.efforts.join(' · ') + (m.defaultEffort ? ` (default ${m.defaultEffort})` : '') : 'no effort setting')))))));
    }
    if (brain.fix && brain.availability !== 'ready') {
      const text = brain.fix;
      node.append(h('div', { class: 'fix' }, h('span', {}, text),
        h('button', { type: 'button', onclick: (e) => { navigator.clipboard?.writeText(text); e.target.textContent = 'copied'; } }, 'copy')));
    }
    return node;
  }

  async function loadStatus(live) {
    $('refresh').disabled = true;
    $('live').disabled = true;
    $('status-cmd').textContent = `brainyard status${live ? ' --live' : ''}`;
    $('cards').setAttribute('aria-busy', 'true');
    $('summary').replaceChildren(h('span', { class: 'busy' }, live ? 'checking with a real call to each CLI…' : 'checking…'));
    try {
      const report = await api(`/api/status${live ? '?live=1' : ''}`);
      state.report = report;
      state.brains = Object.fromEntries(report.brains.map((b) => [b.id, b]));
      $('cards').replaceChildren(...report.brains.map(card));
      const at = new Date(report.checkedAt).toLocaleTimeString();
      $('summary').replaceChildren(
        h('strong', {}, `${report.ready.length} of ${report.brains.length} ready`),
        ` · checked ${at}${live ? ' with live calls' : ''} · node ${report.node} · ${report.platform}`);
      fillBrains();
      banner('');
    } catch (error) {
      $('summary').textContent = '';
      $('cards').replaceChildren();
      if (error.status === 401) banner('This page needs the access token. Open the link printed in the terminal where you ran `brainyard ui`.', 'error');
      else banner(`Could not check: ${error.message}`, 'error');
    } finally {
      $('refresh').disabled = false;
      $('live').disabled = false;
      $('cards').removeAttribute('aria-busy');
    }
  }
  $('refresh').addEventListener('click', () => loadStatus(false));
  $('live').addEventListener('click', () => loadStatus(true));

  // ----- playground controls -------------------------------------------------
  function fillBrains() {
    const select = $('brain');
    const previous = select.value || store.get('brainyard.brain');
    const installed = state.report.brains.filter((b) => b.installed);
    select.replaceChildren(...installed.map((b) => h('option', { value: b.id }, `${b.label}${b.availability === 'ready' ? '' : ` (${WORDS[b.availability]})`}`)));
    if (!installed.length) select.append(h('option', { value: '' }, 'no CLI installed'));
    if (previous && installed.some((b) => b.id === previous)) select.value = previous;
    fillModels();
  }

  function catalog() {
    const brain = state.brains[$('brain').value];
    return brain?.models;
  }

  function fillModels() {
    const models = catalog();
    const select = $('model');
    select.replaceChildren(h('option', { value: '' }, 'default'));
    for (const m of (models?.models) || []) select.append(h('option', { value: m.id }, m.label && m.label !== m.id ? `${m.id} — ${m.label}` : m.id));
    fillEfforts();
    updateMode();
  }

  function fillEfforts() {
    const models = catalog();
    const chosen = models?.models.find((m) => m.id === $('model').value);
    const efforts = chosen ? chosen.efforts : ((models?.defaultEfforts) || []);
    const select = $('effort');
    select.replaceChildren(h('option', { value: '' }, chosen?.defaultEffort ? `default (${chosen.defaultEffort})` : 'default'));
    for (const e of efforts) select.append(h('option', { value: e }, e));
    select.disabled = efforts.length === 0;
  }

  $('brain').addEventListener('change', () => { store.set('brainyard.brain', $('brain').value); state.resume = null; showResume(); fillModels(); });
  $('model').addEventListener('change', fillEfforts);

  function updateMode() {
    for (const button of document.querySelectorAll('.seg button')) button.setAttribute('aria-pressed', String(button.dataset.mode === state.mode));
    for (const node of document.querySelectorAll('[data-for="run"]')) node.hidden = state.mode !== 'run';
    $('prompt').placeholder = state.mode === 'run' ? 'Give the agent a task — it works in the folder above…' : 'Ask something…';
    $('go').textContent = state.mode === 'run' ? 'start agent' : 'ask';
    $('play-cmd').textContent = ['brainyard', state.mode, $('brain').value].filter(Boolean).join(' ');
  }
  for (const button of document.querySelectorAll('.seg button')) {
    button.addEventListener('click', () => { state.mode = button.dataset.mode; if (state.mode === 'ask') { state.resume = null; showResume(); } updateMode(); });
  }

  function showResume() {
    const box = $('resume');
    box.replaceChildren();
    if (!state.resume) return;
    box.append(h('span', { class: 'chip' }, `continuing ${state.resume.slice(0, 8)}…`,
      h('button', { type: 'button', title: 'Start a new conversation', onclick: () => { state.resume = null; showResume(); } }, '✕')));
  }

  $('prompt').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); $('form').requestSubmit(); }
  });

  // ----- running ----------------------------------------------------------------
  const MARKS = { init: '◆', message: '›', thinking: '…', tool_call: '▸', command: '$', file_write: '✎', tool_result: '←', hint: '☞', denied: '⊘', warning: '!', error: '✗', stopped: '■', done: '✓' };
  const labelOf = (id) => (state.brains[id]?.label) || id;

  function panel(brainId, prompt) {
    $('session-title').hidden = false;
    const started = Date.now();
    const clock = h('span', { class: 'clock' }, '0.0s');
    const timer = setInterval(() => { clock.textContent = `${((Date.now() - started) / 1000).toFixed(1)}s`; }, 100);
    const head = h('div', { class: 'legend run-head' }, h('span', { class: 'title' }, labelOf(brainId)), h('span', { class: 'prompt', title: prompt }, prompt), h('span', { class: 'grow' }), clock);
    const node = h('section', { class: 'run panel live', dataset: { brain: brainId } }, head);
    $('session').prepend(node);
    return { node, head, started, clock, stopTimer: () => { clearInterval(timer); node.classList.remove('live'); } };
  }

  function stats(result) {
    const parts = [];
    parts.push(h('span', {}, h('b', {}, `${(result.durationMs / 1000).toFixed(1)}s`)));
    if (result.costUsd !== null && result.costUsd !== undefined) parts.push(h('span', {}, h('b', {}, `$${result.costUsd.toFixed(4)}`), result.costSource === 'estimate' ? ' est.' : ''));
    if (result.model) parts.push(h('span', {}, result.model));
    const u = result.usage || {};
    const tokens = (u.inputTokens || 0) + (u.cacheReadTokens || 0) + (u.cacheWriteTokens || 0);
    parts.push(h('span', {}, `${tokens.toLocaleString()} in · ${(u.outputTokens || 0).toLocaleString()} out`));
    if (result.toolCalls !== undefined) parts.push(h('span', {}, `${result.toolCalls} actions`));
    return parts;
  }

  async function doAsk(body) {
    const view = panel(body.brain, body.prompt);
    const answer = h('div', { class: 'answer' }, h('span', { class: 'busy' }, 'thinking…'));
    view.node.append(answer);
    try {
      const result = await api('/api/ask', { method: 'POST', body });
      answer.replaceChildren(result.text);
      view.node.append(h('div', { class: 'stats' }, stats(result)));
    } catch (error) {
      answer.className = 'answer error';
      answer.replaceChildren(`${error.kind || 'error'}: ${error.message}`, error.fix ? `\n→ ${error.fix}` : '');
    } finally {
      view.stopTimer();
    }
  }

  async function doRun(body) {
    let created;
    try {
      created = await api('/api/runs', { method: 'POST', body });
    } catch (error) {
      const view = panel(body.brain, body.prompt);
      view.stopTimer();
      view.node.append(h('div', { class: 'answer error' }, `${error.kind || 'error'}: ${error.message}${error.fix ? `\n→ ${error.fix}` : ''}`));
      return;
    }
    const view = panel(body.brain, body.prompt);
    const feed = h('ol', { class: 'feed', 'aria-live': 'polite' });
    const stop = h('button', { class: 'btn danger', type: 'button', onclick: () => api(`/api/runs/${created.id}/stop`, { method: 'POST', body: {} }).catch(() => {}) }, 'stop');
    view.head.append(stop);
    view.node.append(feed);
    let steer = null;
    if (created.steerable) {
      const input = h('input', { type: 'text', placeholder: 'Message the agent while it works…', 'aria-label': 'Hint' });
      const send = async () => {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        await api(`/api/runs/${created.id}/hint`, { method: 'POST', body: { text } }).catch(() => {});
      };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
      steer = h('div', { class: 'steer' }, input, h('button', { class: 'btn', type: 'button', onclick: send }, 'send'));
      view.node.append(steer);
    }
    const add = (event) => {
      const offset = Math.max(0, (Date.parse(event.at) - view.started) / 1000);
      const failed = event.kind === 'done' && event.data && event.data.ok === false;
      const classes = [`k-${event.kind}`, event.data?.isError ? 'is-error' : '', failed ? 'failed' : ''].join(' ');
      const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
      feed.append(h('li', { class: classes }, h('span', { class: 't' }, `${offset.toFixed(1)}s`), h('span', { class: 'm' }, failed ? '✗' : MARKS[event.kind] || '·'), h('span', { class: 's' }, event.summary)));
      if (nearBottom) feed.scrollTop = feed.scrollHeight;
    };
    try {
      await follow(created.id, (name, data) => {
        if (name === 'agent' && data.feed) add(data);
        if (name === 'result') finish(data);
        if (name === 'failure') view.node.append(h('div', { class: 'answer error' }, `${data.error.kind}: ${data.error.message}`));
      });
    } catch (error) {
      view.node.append(h('div', { class: 'answer error' }, `stream lost: ${error.message}`));
    } finally {
      view.stopTimer();
      stop.remove();
      if (steer) steer.remove();
    }

    function finish(result) {
      if (result.text?.trim()) view.node.append(h('div', { class: 'answer' }, result.text.trim()));
      else if (!result.ok && result.error) view.node.append(h('div', { class: 'answer error' }, `${result.error.kind}: ${result.error.message}`));
      const folder = created.cwd.split(/[\\/]/).filter(Boolean).pop() || created.cwd;
      const copy = h('button', { class: 'link', type: 'button', title: created.cwd, onclick: (e) => { navigator.clipboard?.writeText(created.cwd); e.target.textContent = 'copied'; } }, 'copy path');
      const where = h('span', { class: 'where' }, h('span', { title: created.cwd }, `folder …/${folder}`), copy);
      const row = h('div', { class: 'stats' }, stats(result), where);
      if (result.sessionId) {
        where.append(h('button', { class: 'btn', type: 'button', onclick: () => {
          state.mode = 'run'; state.resume = result.sessionId;
          $('brain').value = body.brain; fillModels(); $('cwd').value = created.cwd; updateMode(); showResume(); $('prompt').focus();
        } }, 'continue'));
      }
      view.node.append(row);
    }
  }

  async function follow(id, onEvent) {
    const res = await fetch(`/api/runs/${id}/events`, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok || !res.body) throw new Error(res.statusText || 'no stream');
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      for (let cut = buffer.indexOf('\n\n'); cut >= 0; cut = buffer.indexOf('\n\n')) {
        const chunk = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        let name = 'message';
        let data = '';
        for (const line of chunk.split('\n')) {
          if (line.startsWith('event: ')) name = line.slice(7);
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (data) onEvent(name, JSON.parse(data));
      }
    }
  }

  $('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const prompt = $('prompt').value.trim();
    const brain = $('brain').value;
    if (!prompt || !brain) { $('prompt').focus(); return; }
    const body = { brain, prompt };
    if ($('model').value) body.model = $('model').value;
    if ($('effort').value) body.effort = $('effort').value;
    body.web = $('web').checked;
    $('prompt').value = '';
    if (state.mode === 'ask') {
      await doAsk(body);
    } else {
      body.access = $('access').value;
      if ($('cwd').value.trim()) body.cwd = $('cwd').value.trim();
      if (state.resume) body.resume = state.resume;
      await doRun(body);
    }
  });

  updateMode();
  if (!token) {
    $('cards').replaceChildren();
    banner('This page needs the access token. Open the link printed in the terminal where you ran `brainyard ui`.', 'error');
  } else loadStatus(false);
})();
</script>
</body>
</html>
